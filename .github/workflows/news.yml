name: LoL News Hunter v6
on:
  workflow_dispatch:
  schedule:
    # UTC: 02:30, 08:30, 14:30, 20:30 = Iran 06:00, 12:00, 18:00, 00:00
    - cron: '30 2,8,14,20 * * *'
permissions:
  contents: write
concurrency:
  group: lol-news-hunter
  cancel-in-progress: false
jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
        
      - name: Test Telegram group connection
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()

          print("Chat ID configured:", bool(chat_id))
          print("Chat ID length:", len(chat_id))

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": "✅ LoL News Hunter: GitHub connection successful!"
              },
              timeout=20
          )

          print("Telegram status:", response.status_code)
          print("Telegram response:", response.text[:500])
          response.raise_for_status()
          PY

      - name: Check and send news
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRANSLATE_TITLES: 'true'
        run: python bot.py
      - name: Save seen news
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update seen news [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
