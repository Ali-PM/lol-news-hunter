
name: LoL News Hunter

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lol-news-hunter
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore previous news
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: news-${{ github.run_id }}
          restore-keys: |
            news-

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check and send news
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save processed news
        if: success()
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: news-${{ github.run_id }}
